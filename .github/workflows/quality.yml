name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  DATABASE_URL: postgresql://pacecraft:pacecraft@localhost:5432/pacecraft
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: pacecraft
          POSTGRES_PASSWORD: pacecraft
          POSTGRES_USER: pacecraft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pacecraft -d pacecraft"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.4.2 }
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with: { version: 3.53.1 }
      - run: bun install --frozen-lockfile
      - run: task db:migrate
      - run: task check
      - run: bun test apps/api/tests/database.integration.test.ts apps/api/src/infrastructure/database --max-concurrency 4
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://pacecraft:pacecraft@localhost:5432/postgres
      - run: task openapi:check
      - if: github.event_name == 'pull_request'
        run: bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - run: docker build --target runtime --tag pacecraft-api:test .
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose up --build --wait
      - run: curl --fail --silent http://localhost:3000/health/ready
      - if: always()
        run: docker compose down --volumes
