name: pacecraft-tests

services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: pacecraft_test
      POSTGRES_USER: pacecraft_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacecraft_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
