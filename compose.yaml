name: pacecraft

services:
  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://pacecraft:pacecraft@postgres:5432/pacecraft
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      HOST: 0.0.0.0
      LOG_LEVEL: info
      PORT: 3000
      NODE_ENV: development
      DEV_ATHLETE_ID: 019f3ed0-0000-7000-8000-000000000001
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:3000/health/ready');if(!r.ok)process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: development
    command: ["bun", "run", "--filter", "@pacecraft/api", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://pacecraft:pacecraft@postgres:5432/pacecraft
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: pacecraft
      POSTGRES_PASSWORD: pacecraft
      POSTGRES_USER: pacecraft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacecraft -d pacecraft"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
